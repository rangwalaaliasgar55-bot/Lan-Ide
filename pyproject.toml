[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-ide"
# Fuente única de versión = archivo VERSION (el mismo que lee el motor en
# runtime, ver plotspace/routers/system.py). Se resuelve más abajo, en
# [tool.setuptools.dynamic]; nunca hardcodear acá o se desincroniza.
dynamic = ["version"]
description = "Lan Ide — tu flota de agentes de código, en una app"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aliasgar Rangwala" }]
keywords = ["ai", "agents", "terminal", "claude", "codex", "orchestration"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

# Lo MÍNIMO para arrancar y trabajar. Todo lo pesado va en extras: sin eso, un
# `pip install .` se baja 1,3 GB para alguien que quizá nunca use el
# dictado local ni el browser remoto. Espejo de packaging/requirements-base.txt,
# que es lo que viaja en el instalador.
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "websockets>=12.0",
  "httptools>=0.6.0",
  "aiofiles>=23.0.0",
  "python-multipart>=0.0.6",
  "anthropic>=0.100.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "edge-tts>=6.0.0",
  # Puertos en LISTEN, cwd y cmdline de procesos: reemplaza a `ss` y a leer
  # /proc, que no existen fuera de Linux.
  "psutil>=5.9.0",
  # Solo Unix (arrastra pty/termios/fcntl). En Windows el motor de terminales
  # es el termhost y este paquete no hace falta.
  "ptyprocess>=0.7.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Dictado con el modelo corriendo en tu máquina. Con STT_MOTOR=groq el dictado
# es remoto y no hace falta nada de esto.
voice = ["onnx-asr[cpu,hub]>=0.11", "numpy>=1.24.0"]
# Vía de escape del dictado local (STT_MOTOR=whisper).
whisper = ["faster-whisper>=1.1.0", "numpy>=1.24.0"]
# Browser remoto del Web Preview: para los sitios que bloquean el iframe.
# Además del paquete hay que bajar el navegador: `playwright install chromium`.
browser = ["playwright>=1.50.0", "Pillow>=10.0.0"]
all = ["lan-ide[voice,browser]"]

[project.urls]
Homepage = "https://github.com/rangwalaaliasgar55-bot/Lan-Ide"
Issues = "https://github.com/rangwalaaliasgar55-bot/Lan-Ide/issues"

[project.scripts]
lanide = "plotspace.cli:main"
lan-ide = "plotspace.cli:main"

[tool.setuptools]
# El paquete se llama como el producto. `frontend/` queda como hermano y no
# adentro: moverlo cambiaría cada ruta relativa del repo sin aportar nada hoy
# (el instalador lo toma igual, ver packaging/armar_bundle.py).
packages = ["plotspace", "plotspace.core", "plotspace.routers"]
include-package-data = true

[tool.setuptools.package-data]
plotspace = ["../frontend/**/*"]

[tool.setuptools.dynamic]
# La versión sale del archivo VERSION vía plotspace.__version__ (que lo lee y
# hace strip del \n final). Una sola fuente de verdad, imposible de divergir.
version = { attr = "plotspace.__version__" }

# ─── Ruff ────────────────────────────────────────────────────────────────────
# Este repo NO usa un formateador ni enforcea estilo: tiene convención propia
# (comentarios largos que explican el PORQUÉ, nombres en español) y un linter
# opinado encima solo generaría ruido en cada PR.
#
# Lo que SÍ se chequea es lo que es un BUG: un nombre indefinido que revienta
# recién cuando se entra al `except`, un import muerto, una redefinición que
# tapa a la anterior. De ese set salió el `proc.kill()` sobre una variable
# inexistente en el handler de errores de los workflows.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend/vendor", "desktop/node_modules", "venv", ".venv"]

[tool.ruff.lint]
select = [
  "F",      # pyflakes: indefinidos, imports muertos, redefiniciones
  "E9",     # errores de sintaxis / IO
  "B002", "B003", "B004", "B005", "B006", "B012", "B014", "B015",
  "B017", "B018", "B019", "B020", "B021", "B022", "B023", "B025",
  "B029", "B030", "B031", "B032", "B033", "B034",
  "PLE",    # pylint: errores, no opiniones
]
ignore = [
  # Los tests asignan resultados que no usan para documentar la forma de la
  # respuesta; no es un bug y tacharlo empeora la lectura.
  "F841",
]

[tool.ruff.lint.per-file-ignores]
# `from x import *` en el puente de compatibilidad: es su razón de existir.
"backend/main.py" = ["F403", "F405"]
