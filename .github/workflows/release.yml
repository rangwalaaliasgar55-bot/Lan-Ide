name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create/update
        required: true
        default: v1.7.3
      prerelease:
        description: Mark as prerelease
        type: boolean
        required: false
        default: false
  # Se dispara con un TAG, no con un push a una rama. Antes esto colgaba de
  # `branches: [arena/01a0a44f-lan-ide]` — una rama de trabajo ya mergeada—, así
  # que cada push a esa rama publicaba un Release PÚBLICO y le movía el `latest`
  # a los usuarios con un build intermedio. Un release sale cuando alguien
  # etiqueta una versión, que es un acto deliberado.
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-setup:
    name: Build Windows setup and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        shell: pwsh
        run: |
          # En un push de tag, el tag ES la referencia (refs/tags/vX.Y.Z). Caer
          # al default hardcodeado acá publicaría el build bajo una versión
          # ajena y le pisaría los assets a un release ya publicado.
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          if (-not $tag) { throw 'no se pudo resolver el tag del release' }
          $pre = '${{ github.event.inputs.prerelease }}'
          if (-not $pre) { $pre = 'false' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PRERELEASE=$pre" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release tag: $tag"
          Write-Host "Prerelease: $pre"

      - name: Build LanIdeSetup.exe
        shell: pwsh
        run: .\packaging\windows\build-setup.ps1 -OutDir dist -ReleaseRef "$env:RELEASE_TAG"

      - name: Write release notes
        shell: pwsh
        run: |
          $notes = @'
          # Lan Ide __TAG__

          Founder: Aliasgar Rangwala

          ## Windows download

          Download `LanIdeSetup.exe` from this release and run it. The setup bootstraps WSL2 Ubuntu if needed, clones this exact release of Lan Ide, installs the Python app, and creates `LanIde.bat` on the Desktop.

          ## Notes

          - Lan Ide is BYOK: it does not bundle Claude, Codex, Grok, Qwen, or any third-party agent account.
          - The executable is unsigned because no code-signing certificate is configured in this repository yet.
          - SHA256 checksum is attached as `LanIdeSetup.exe.sha256`.
          - MIT license attribution is retained in the repository license.
          '@
          $notes.Replace('__TAG__', $env:RELEASE_TAG) | Set-Content -Path dist\RELEASE_NOTES.md -Encoding UTF8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanIdeSetup
          path: |
            dist/LanIdeSetup.exe
            dist/LanIdeSetup.exe.sha256

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @('dist\LanIdeSetup.exe#LanIdeSetup.exe', 'dist\LanIdeSetup.exe.sha256#LanIdeSetup.exe.sha256')
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            gh release edit $env:RELEASE_TAG --title "Lan Ide $env:RELEASE_TAG" --notes-file dist\RELEASE_NOTES.md
          } else {
            $cmd = @('release', 'create', $env:RELEASE_TAG, '--target', $env:GITHUB_SHA, '--title', "Lan Ide $env:RELEASE_TAG", '--notes-file', 'dist\RELEASE_NOTES.md')
            if ($env:PRERELEASE -eq 'true') { $cmd += '--prerelease' } else { $cmd += '--latest' }
            $cmd += $assets
            gh @cmd
          }
